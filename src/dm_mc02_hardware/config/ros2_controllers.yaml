# Real hardware controller configuration for DM-MC02
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz, matches firmware STATE frame rate

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    {}

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: false

    constraints:
      stopped_velocity_tolerance: 0.05  # rad/s
      goal_time: 0.5  # seconds

      joint1:
        trajectory: 0.05  # rad
        goal: 0.02
      joint2:
        trajectory: 0.05
        goal: 0.02
      joint3:
        trajectory: 0.05
        goal: 0.02
      joint4:
        trajectory: 0.05
        goal: 0.02
      joint5:
        trajectory: 0.05
        goal: 0.02
      joint6:
        trajectory: 0.05
        goal: 0.02

gripper_controller:
  ros__parameters:
    joints:
      - joint8

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.001  # m/s
      goal_time: 1.0

      joint8:
        trajectory: 0.002  # meters
        goal: 0.001
